services:
  neo4j:
    image: neo4j:5.26.8-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/local-dev-only
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p local-dev-only 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEMO_MODE: "true"
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: local-dev-only
      APP_ADMIN_TOKEN: local-admin-token
      APP_API_TOKEN: local-reader-token
      INLINE_JOBS: "true"
      CORS_ORIGINS: http://localhost:5173
      DATA_DIR: /data
      TLS_VERIFY: "true"
    volumes:
      - app-data:/data
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_PROXY: http://api:8000
    depends_on:
      - api

volumes:
  neo4j-data:
  app-data:
