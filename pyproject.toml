[project]
name = "sf-ontology"
version = "0.1.0"
description = "Discover a SuccessFactors Core HR model, review an ontology, and load a Neo4j knowledge graph."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "httpx==0.28.1",
  "lxml==6.1.3",
  "neo4j==6.4.1",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = [
  "integration: requires a local Neo4j instance (set NEO4J_INTEGRATION=1)",
]
